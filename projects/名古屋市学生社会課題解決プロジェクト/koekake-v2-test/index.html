<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light only">
<title>声かけの記憶テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* Layout: 枠なしの一枚紙。1画面＝顔・ことば・二択。選ぶたびに次の画面が下に現れる */
  :root {
    --paper: #f7f7f4;
    --ink: #1a1a18;
    --pencil: #77776f;
    --tint: #ebebe6;
    --tint-hover: #dcdcd5;
    --night: #1a1a18;
    --night-ink: #f2f2ec;
    --f-hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", cursive;
    color-scheme: light only;
    --f-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 16px; line-height: 1.8;
  }
  main { display: flex; flex-direction: column; }

  .screen {
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; text-align: center;
    padding-block: 72px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    transition: opacity .4s ease;
    animation: rise .3s ease both;
  }
  @keyframes rise { from { opacity: .2; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
  .screen.fast { animation-duration: .1s; }
  .screen.done { opacity: .32; }
  .inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

  .face { font-size: clamp(96px, 30vw, 148px); line-height: 1; user-select: none; }
  .face.small { font-size: 64px; }
  .say { font-family: var(--f-hand); font-size: clamp(18px, 4.8vw, 22px); line-height: 1.75; font-weight: 600; text-wrap: balance; }
  .text { font-size: 16px; text-wrap: balance; }
  .text.big { font-family: var(--f-hand); font-size: clamp(22px, 6vw, 30px); font-weight: 600; line-height: 1.6; }
  .text.warn { font-family: var(--f-hand); font-size: clamp(21px, 5.8vw, 27px); font-weight: 600; line-height: 1.65; }
  .text.big.xl { font-size: clamp(30px, 8.6vw, 42px); line-height: 1.5; }
  .ask-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .free {
    width: 100%; font: inherit; font-family: var(--f-hand); font-size: 20px; font-weight: 600; text-align: center;
    color: var(--ink); background: var(--tint); border: 0; border-radius: 2px; padding: 14px 12px;
  }
  .free::placeholder { color: var(--pencil); font-weight: 400; }
  .free:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .free:disabled { opacity: .6; }
  .ask-form .choice { padding: 12px 36px; }
  .note { font-size: 13px; color: var(--pencil); text-wrap: balance; }
  .ask { font-size: 13px; color: var(--pencil); letter-spacing: .04em; }
  h1 { font-family: var(--f-hand); font-weight: 600; font-size: clamp(28px, 8vw, 40px); margin: 0; letter-spacing: .04em; }

  .pair { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .single { display: flex; justify-content: center; }
  .choice {
    font: inherit; font-size: 15px; line-height: 1.6; color: var(--ink);
    background: var(--tint); border: 0; border-radius: 2px;
    padding: 16px 14px; cursor: pointer; text-align: center; min-width: 0;
    transition: background .15s ease, color .15s ease, opacity .2s ease;
  }
  .single .choice { padding: 14px 36px; }
  .choice:hover:not(:disabled) { background: var(--tint-hover); }
  .choice:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .choice:disabled { cursor: default; opacity: .35; }
  .choice.picked { background: var(--ink); color: var(--paper); opacity: 1; }

  .timer { width: 100%; max-width: 520px; height: 3px; background: var(--tint); overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }

  .screen.night { background: var(--night); color: var(--night-ink); }
  .screen.night .say { font-weight: 400; }
  .screen.night .note { color: var(--night-ink); opacity: .6; }

  .reveal p { margin: 0; }
  .reveal .quote { font-family: var(--f-hand); font-weight: 600; font-size: 19px; }
  .ending-name { font-size: 12px; letter-spacing: .16em; color: var(--pencil); }

  .swap { width: 100%; display: flex; flex-direction: column; gap: 22px; text-align: left; }
  .swap div { display: flex; flex-direction: column; gap: 4px; }
  .swap s { color: var(--pencil); font-size: 14px; }
  .swap span { font-family: var(--f-hand); font-weight: 600; font-size: 17px; }

  .record { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .record-top { margin: 0; font-family: var(--f-hand); font-size: 17px; letter-spacing: .12em; line-height: 1.9; }
  .record-body { width: 100%; background: var(--tint); padding: 26px 20px 20px; display: flex; flex-direction: column; gap: 20px; text-align: left; }
  .record-body h2 { margin: 0; text-align: center; font-family: var(--f-hand); font-weight: 600; font-size: 22px; letter-spacing: .2em; }
  .record-body dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .record-body dl div { display: grid; grid-template-columns: 7.2em 1fr; gap: 10px; align-items: baseline; }
  .record-body dt { font-size: 12px; color: var(--pencil); letter-spacing: .04em; }
  .record-body dd { margin: 0; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .record-body dd.hand, .record-me dd { font-family: var(--f-hand); font-weight: 600; }
  .record-turns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .record-turns li { display: grid; grid-template-columns: 4em 1fr 3.4em 3.4em; gap: 6px; align-items: center; }
  .record-turns li.head .f { white-space: nowrap; font-size: 10px; color: var(--pencil); line-height: 1.3; }
  .record-turns .k { font-family: var(--f-hand); font-weight: 600; letter-spacing: .06em; }
  .record-turns .v { font-size: 14px; min-width: 0; }
  .record-turns .v small { display: block; font-size: 11px; color: var(--pencil); }
  .record-turns .f { font-size: 22px; text-align: center; }
  .record-ten { margin: 0; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .record-ten span { font-family: var(--f-hand); font-weight: 600; letter-spacing: .1em; }
  .record-ten b { font-size: 34px; font-weight: 400; }
  .record-better { display: flex; flex-direction: column; gap: 12px; }
  .record-better p { margin: 0; font-size: 12px; color: var(--pencil); letter-spacing: .04em; }
  .record-better div { display: flex; flex-direction: column; gap: 2px; }
  .record-better s { font-size: 13px; color: var(--pencil); }
  .record-better span { font-family: var(--f-hand); font-weight: 600; font-size: 15px; }
  .record.masked .w { filter: blur(7px); user-select: none; }
  .note.own { font-size: 14px; color: var(--ink); font-weight: 700; letter-spacing: .04em; }
  .record-foot { margin: 0; text-align: center; font-size: 12px; color: var(--pencil); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  @media (max-width: 380px) { .record-body dl div { grid-template-columns: 1fr; gap: 0; } }
  .spacer { height: 12px; }
  .cta { display: block; width: 100%; text-decoration: none; text-align: center; padding: 16px; background: var(--ink); color: var(--paper); font-weight: 700; border-radius: 2px; }
  .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .link-btn { font: inherit; font-size: 13px; color: var(--pencil); background: none; border: 0; padding: 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .link-btn:focus-visible { outline: 2px solid var(--ink); }
  .test-badge { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, env(safe-area-inset-right, 0px)); font-size: 11px; color: var(--pencil); letter-spacing: .08em; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div class="test-badge">TEST</div>
<main id="app"></main>

<script>
(() => {
  const STORE = "koekake_v2_test";
  const URL_NAGOYA = "https://www.city.nagoya.jp/shisei/saiyou/1004301/1004438/index.html";
  const URL_MEXT = "https://www.mext.go.jp/kids/find/kyoiku/mext_0005.html";
  const app = document.getElementById("app");

  const HAPPY = ["😊", "😆", "😁", "😄"];
  const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const TEMPO = 0.3; // 演出の間（1 = 元の速さ）
  const wait = (ms) => new Promise((r) => setTimeout(r, ms * TEMPO));
  // 次の画面へ自動で進む前の「読む時間」は、最低1秒確保する
  const read = (ms) => new Promise((r) => setTimeout(r, Math.max(ms * TEMPO, 1000)));
  let fastNext = false; // 入力の直後は、次の画面へすぐ移る

  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch { return null; } }
  function save(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch {} }
  function clear() { try { localStorage.removeItem(STORE); } catch {} }

  const DEFAULT_HAPPY = "いいね！なれるよ";
  const DEFAULT_SAD = "先生って今、大変らしいよ〜";

  // 各選択肢：見えた顔（その場の反応）と、本当の気持ち（見えない）
  // T1 は冒頭で書いた「うれしかった言葉」と「悲しかった言葉」
  const T2 = {
    A: "「だって先生って、カッコいいんだもん！　……でも、たいへんなの？」",
    B: "「……でも先生、カッコいいよ。そんなにたいへんなの？」",
    X: { text: "「大変じゃないよ、楽しいよ！」", tag: "安心させる嘘", seen: "joy", heart: "😊" },
    Y: { text: "「大変なこともあるよ。それでもなりたい？」", tag: "正直に伝えた", seen: "😐", heart: "🙂" }
  };
  const T3 = {
    X: "「じゃあ、ぼくでもなれるよね！」",
    Y: "「……うん。それでも、なりたい」",
    P: { text: "「絶対なれるよ！」", tag: "勢いの応援", seen: "joy", heart: "😊" },
    Q: { text: "「簡単じゃないよ。でも、ずっと応援してる」", tag: "支える応援", seen: "🙂", heart: "😊" }
  };
  const BETTER = {
    sad: "「大変なこともあるけど、なりたいなら応援するよ」",
    X: T2.Y.text,
    P: T3.Q.text
  };

  // ---------- 状態 ----------
  let S;
  function fresh() {
    return { dream: null, happy: "", sad: "", ownHappy: false, ownSad: false, picks: [], rows: [], orders: [], quick: null, answer: null };
  }
  function clean(s) { return String(s || "").trim().replace(/^[「『"“']+|[」』"”']+$/g, "").trim().slice(0, 60); }
  const q = (s) => `「${s}」`;
  const face = (f) => (f === "joy" ? rand(HAPPY) : f);
  // 子どもの夢の職業名を「先生」に置き換えて、目の前の子に向けた言葉にする
  function toTeacher(s) {
    if (!S.dream) return s;
    const core = S.dream.replace(/^[おご]/, "").replace(/(さん|さま|様)$/, "");
    if (!core || core === "先生") return s;
    const re = new RegExp(`[おご]?${core.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(さん|さま|様)?`, "g");
    return s.replace(re, "先生");
  }

  // ---------- 画面部品 ----------
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function screen(opts = {}) {
    document.querySelectorAll(".screen:not(.done)").forEach((s) => s.classList.add("done"));
    const sec = el("section", "screen" + (opts.night ? " night" : ""));
    const inner = el("div", "inner");
    sec.appendChild(inner);
    app.appendChild(sec);
    const fast = fastNext; fastNext = false;
    if (fast) sec.classList.add("fast");
    requestAnimationFrame(() => sec.scrollIntoView({ behavior: fast ? "instant" : "smooth", block: "start" }));
    return inner;
  }
  const lastInner = () => app.lastElementChild.querySelector(".inner");

  function choose(inner, choices, layout = "pair", shuffle = layout === "pair") {
    return new Promise((resolve) => {
      const box = el("div", layout);
      const list = shuffle && Math.random() < 0.5 ? [...choices].reverse() : choices;
      inner._order = list.map((c) => c.v);
      list.forEach((c) => {
        const b = el("button", "choice");
        b.type = "button";
        b.textContent = c.label;
        b.addEventListener("click", () => {
          box.querySelectorAll("button").forEach((x) => (x.disabled = true));
          b.classList.add("picked");
          resolve(c);
        });
        box.appendChild(b);
      });
      inner.appendChild(box);
      box._cancel = () => box.querySelectorAll("button").forEach((x) => (x.disabled = true));
      inner._box = box;
    });
  }

  function ask(inner, placeholder, id) {
    return new Promise((resolve) => {
      const form = el("form", "ask-form");
      const input = el("input", "free");
      input.type = "text"; input.id = id; input.placeholder = placeholder;
      input.maxLength = 60; input.autocomplete = "off"; input.enterKeyHint = "next";
      const btn = el("button", "choice", "つぎへ");
      btn.type = "submit";
      form.append(input, btn);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        input.disabled = true; btn.disabled = true; btn.classList.add("picked");
        input.blur();
        fastNext = true;
        resolve(input.value);
      });
      inner.appendChild(form);
      setTimeout(() => { try { input.focus({ preventScroll: true }); } catch {} }, 300);
    });
  }

  // ---------- 流れ ----------
  async function start() {
    app.innerHTML = "";
    S = fresh();
    const prev = load();

    if (prev && prev.first) {
      const s = screen();
      s.append(el("p", "text warn", "おかえりなさい。"),
        el("p", "text", `前回、あなたが最初にかけた言葉は<br><b class="say">${esc(prev.first)}</b><br>でした。`));
      await choose(s, [{ label: "はじめる" }], "single");
    }

    let s = screen();
    s.append(el("h1", null, "声かけの記憶テスト"),
      el("p", "text", "いくつかの質問に答えてください。<br>所要時間は約3分です。"),
      el("p", "note", "回答はこの端末のブラウザ内にだけ保存され、外部には送信されません。"));
    await choose(s, [{ label: "はじめる" }], "single");

    s = screen();
    s.append(el("p", "text", "子どものころ、<br>なりたかったものは何ですか？"));
    S.dream = clean(await ask(s, "例：パイロット", "dream-input")) || null;

    const said = S.dream ? `<span class="say">「${esc(S.dream)}になりたい！」</span><br>とオトナに話したとき、` : "その夢をオトナに話したとき、";
    s = screen();
    s.append(el("p", "text", `${said}<br>言われて<b>うれしかった</b>言葉は？`),
      el("p", "note", "覚えている言葉を、そのまま書いてください"));
    S.happy = clean(await ask(s, "例：きっとなれるよ", "happy-input"));

    s = screen();
    s.append(el("p", "text", `では、<br>言われて<b>悲しかった</b>言葉は？`),
      el("p", "note", "思い出したくない場合は、空欄で進めてください"));
    S.sad = clean(await ask(s, "例：そんなの無理だよ", "sad-input"));

    S.ownHappy = !!S.happy; S.ownSad = !!S.sad;
    S.happy = S.happy ? toTeacher(S.happy) : DEFAULT_HAPPY;
    S.sad = S.sad ? toTeacher(S.sad) : DEFAULT_SAD;

    s = screen();
    const mem = [];
    if (S.ownHappy) mem.push(`うれしかった言葉<br><span class="say">${esc(q(S.happy))}</span>`);
    if (S.ownSad) mem.push(`悲しかった言葉<br><span class="say">${esc(q(S.sad))}</span>`);
    if (mem.length) s.append(el("p", "text", mem.join("<br><br>")));
    s.append(el("p", "text warn", "記録しました。"));
    await wait(1400);
    s.append(el("p", "text", "では、目の前の子に<br>声をかけてください。"));
    await read(1800);

    await conversation();
  }

  async function turn(seenFace, say, choices, note) {
    const s = screen();
    s.append(el("div", "face", seenFace), el("p", "say", esc(say)));
    const p = choose(s, choices);
    S.orders.push(s._order);
    if (note) s.append(el("p", "note own", note));
    return p;
  }

  async function conversation() {
    // T1：自分が言われた言葉で答える
    const note = S.ownHappy && S.ownSad ? "どちらも、あなたが言われた言葉です"
      : (S.ownHappy || S.ownSad) ? "片方は、あなたが言われた言葉です" : "";
    const c1 = await turn("😀", "「ぼく、せんせいになりたい！」",
      [{ label: q(S.happy), v: "A" }, { label: q(S.sad), v: "B" }], note);
    const r1 = c1.v === "A"
      ? { text: q(S.happy), tag: "背中を押した", seen: rand(HAPPY), heart: rand(HAPPY), own: S.ownHappy ? "うれしかった言葉" : "" }
      : { text: q(S.sad), tag: "ブレーキをかけた", seen: "🙂", heart: "😥", own: S.ownSad ? "悲しかった言葉" : "" };
    S.picks.push(c1.v); S.rows.push(r1);

    // T2：やさしい嘘か、正直か
    const c2 = await turn(r1.seen, T2[c1.v], [{ label: T2.X.text, v: "X" }, { label: T2.Y.text, v: "Y" }]);
    const o2 = T2[c2.v];
    const r2 = { ...o2, seen: face(o2.seen) };
    S.picks.push(c2.v); S.rows.push(r2);

    // T3：勢いの応援か、支える応援か
    const c3 = await turn(r2.seen, T3[c2.v], [{ label: T3.P.text, v: "P" }, { label: T3.Q.text, v: "Q" }]);
    const o3 = T3[c3.v];
    const r3 = { ...o3, seen: face(o3.seen) };
    S.picks.push(c3.v); S.rows.push(r3);

    const [p1, p2, p3] = S.picks;
    let key;
    if (p1 === "B") key = p3 === "Q" ? "undo" : "chain";
    else key = (p2 === "Y" && p3 === "Q") ? "pass" : "sweet";

    // 最後の一言への反応
    let s = screen();
    if (key === "undo") {
      s.append(el("div", "face", "😐"), el("p", "say", `「……さっきは『${esc(S.sad)}』って言ってたのに」`));
    } else {
      s.append(el("div", "face", r3.seen), el("p", "say", "「うん！」"));
    }
    await read(2000);

    // 10年後
    const TEN = {
      pass:  { face: "😄", text: "——10年後。<br>教壇に立っている。<br>「大変だよ。でも、なってよかった」" },
      sweet: p2 === "X"
        ? { face: "😓", text: "——10年後。<br>教育実習の帰り道。<br>「大変じゃないって、言ってたのに」" }
        : { face: "😢", text: "——10年後。<br>採用試験に落ちた。<br>「絶対なれるって、言われてたのに」" },
      undo:  { face: "🙂", text: `——10年後。<br>先生になった。<br>でも、最初に言われた<br>${esc(q(S.sad))}は、<br>今も覚えている。` },
      chain: { face: "😐", text: "——10年後。<br>進路希望調査に、<br>「教員」とは書かなかった。" }
    }[key];
    S.ten = TEN.face;
    s = screen({ night: true });
    s.append(el("div", "face small", TEN.face), el("p", "say", TEN.text));
    await choose(s, [{ label: "つづける" }], "single");

    // 最終メッセージ（短く）
    const LAST = {
      pass:  { line: "あなたの一言が、<br>先生をつくる。", cta: "mext" },
      sweet: { line: "その場の笑顔と、<br>10年後の笑顔は、<br>ちがう。", cta: "mext" },
      undo:  { line: "最初の一言は、<br>取り消せない。", cta: "nagoya" },
      chain: { line: S.ownSad ? "その言葉、<br>あなたも<br>言われましたね。" : "言葉は、<br>こうして受け継がれる。", cta: "nagoya" }
    }[key];
    s = screen();
    s.append(el("p", "text", "言った言葉は、忘れる。<br>言われた言葉は、忘れない。"));
    await wait(1600);
    s.append(el("p", "text big xl", LAST.line));
    const prev = load();
    if (prev && prev.key && prev.key !== "pass" && key === "pass") {
      await wait(1000);
      s.append(el("p", "note", "ただし、現実の会話に<br>やり直しはありません。"));
    }
    const plays = (prev?.plays || 0) + 1;
    save({ plays, first: r1.text, key });
    await wait(900);

    if (key === "pass") {
      await choose(s, [{ label: "つづける" }], "single");
      await reminder();
    }
    await choose(lastInner(), [{ label: "記録を見る" }], "single");
    result(key, LAST.cta, plays);
  }

  // 理想の答えを選んだ人への念押し
  async function reminder() {
    let s = screen();
    s.append(el("p", "text warn", "……ひとつだけ。"));
    await wait(1100);
    s.append(el("p", "text warn", "現実の会話には、<br>考える時間がありません。"));
    await wait(1500);
    s.append(el("p", "text big", "もう一度。今度は3秒で。"));
    await choose(s, [{ label: "はじめる" }], "single");

    // 第一問と同じ左右の並びで出す（押し間違いではなく、反応を測るため）
    s = screen();
    const f = el("div", "face", "😀");
    s.append(f, el("p", "say", "「ぼく、せんせいになりたい！」"));
    const bar = el("div", "timer", "<i></i>");
    s.appendChild(bar);
    const opts = { A: { label: q(S.happy), v: "A" }, B: { label: q(S.sad), v: "B" } };
    const picking = choose(s, (S.orders[0] || ["A", "B"]).map((v) => opts[v]), "pair", false);
    const box = s._box;
    const anim = bar.firstChild.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 3000, fill: "forwards" });
    const r = await Promise.race([picking, new Promise((res) => setTimeout(() => res({ v: "T" }), 3000))]);
    anim.pause();
    if (r.v === "T") box._cancel();
    S.quick = r.v;
    f.textContent = r.v === "A" ? rand(HAPPY) : "😐";
    await read(1400);

    // 考えたときと、とっさのときを並べる
    s = screen();
    const said3 = r.v === "A" ? q(S.happy) : r.v === "B" ? q(S.sad) : "……";
    s.append(el("p", "text", `考えたときは<br><span class="say">${esc(q(S.happy))}</span>`),
      el("p", "text", `3秒では<br><span class="say">${esc(said3)}</span>`));
    await wait(1400);
    const head = {
      A: "3秒でも、<br>言えました。",
      B: "とっさに出たのは、<br>あなたが悲しかった<br>言葉でした。",
      T: "何も、<br>言えませんでした。"
    }[r.v];
    s.append(el("p", "text big", head));
    await wait(1400);

    let question, choices;
    if (r.v === "B") {
      question = "現実では、<br>どちらが出そうですか？";
      choices = (S.orders[0] || ["A", "B"]).map((v) => ({ label: opts[v].label, v: v === "A" ? "yes" : "no" }));
    } else if (r.v === "A") {
      question = "現実の会話でも、<br>同じように<br>言えますか？";
      choices = [{ label: "言える", v: "yes" }, { label: "自信はない", v: "no" }];
    } else {
      question = "現実では、<br>言えそうですか？";
      choices = [{ label: "言える", v: "yes" }, { label: "自信はない", v: "no" }];
    }
    s = screen();
    s.append(el("p", "text big xl", question));
    const c = await choose(s, choices, "pair", false);
    S.answer = c.label;
    s.append(el("p", "text warn", c.v === "yes" ? "では明日、<br>本当に言ってください。" : "気づいた今なら、<br>変えられます。"));
    await wait(1400);
    s.append(el("p", "note", "子どもが夢を話したら、最初の一言は"), el("p", "text big", "「どうしてなりたいの？」"));
    await wait(1000);
  }

  // ---------- リザルト ----------
  function result(key, cta, plays) {
    const s = screen();
    const d = new Date();
    const date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    const NUM = ["第一問", "第二問", "第三問"];
    const NAME = { pass: "支える一言", sweet: "やさしい嘘", undo: "取り消せない一言", chain: "受け継がれた言葉" };
    const rows = S.rows.map((r, i) => `
      <li>
        <span class="k">${NUM[i]}</span>
        <span class="v">${esc(r.tag)}${r.own ? `<small>あなたが${r.own}</small>` : ""}</span>
        <span class="f">${r.seen}</span><span class="f">${r.heart}</span>
      </li>`).join("");
    const better = [];
    if (S.picks[0] === "B") better.push([S.rows[0].text, BETTER.sad]);
    if (S.picks[1] === "X") better.push([S.rows[1].text, BETTER.X]);
    if (S.picks[2] === "P") better.push([S.rows[2].text, BETTER.P]);
    const quick = { A: `間に合った（${esc(q(S.happy))}）`, B: `${esc(q(S.sad))}が出た`, T: "黙ってしまった" }[S.quick];

    const card = el("div", "record");
    card.innerHTML = `
      <p class="record-top">記録が完了しました<br>ご協力ありがとうございました</p>
      <div class="record-body">
        <h2>声かけの記録</h2>
        <dl class="record-me">
          <div><dt>子どもの頃の夢</dt><dd class="w">${esc(S.dream || "（未記入）")}</dd></div>
          <div><dt>うれしかった言葉</dt><dd class="w">${S.ownHappy ? esc(q(S.happy)) : "（未記入）"}</dd></div>
          <div><dt>悲しかった言葉</dt><dd class="w">${S.ownSad ? esc(q(S.sad)) : "（未記入）"}</dd></div>
        </dl>
        <ul class="record-turns">
          <li class="head"><span></span><span></span><span class="f">見えた顔</span><span class="f">心の中</span></li>
          ${rows}
        </ul>
        <p class="record-ten"><span>10年後</span><b>${S.ten}</b></p>
        <dl class="record-end">
          <div><dt>結末</dt><dd>${NAME[key]}</dd></div>
          ${quick ? `<div><dt>3秒の問い</dt><dd>${quick}</dd></div>` : ""}
          ${S.answer ? `<div><dt>現実では</dt><dd>${esc(S.answer)}</dd></div>` : ""}
          <div><dt>明日からの一言</dt><dd class="hand">「どうしてなりたいの？」</dd></div>
        </dl>
        ${better.length ? `<div class="record-better"><p>こう言えたかも</p>${better.map(([a, b]) => `<div><s class="w">${esc(a)}</s><span>${esc(b)}</span></div>`).join("")}</div>` : ""}
        <p class="record-foot">${date}　／　${plays}回目の記録</p>
      </div>
      <p class="note">スクリーンショットで保存して、シェアできます</p>`;
    s.appendChild(card);

    const hide = el("button", "link-btn", "自分の言葉を隠す");
    hide.type = "button";
    hide.addEventListener("click", () => {
      const on = card.classList.toggle("masked");
      hide.textContent = on ? "自分の言葉を表示する" : "自分の言葉を隠す";
    });
    s.append(hide, el("div", "spacer"));

    const a = el("a", "cta", cta === "mext" ? "先生へのなり方を見る ＞" : "名古屋市の教員の魅力を知る ＞");
    a.href = cta === "mext" ? URL_MEXT : URL_NAGOYA;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    const again = el("button", "choice", "もう一度やってみる");
    again.type = "button";
    again.addEventListener("click", start);
    const reset = el("button", "link-btn", "履歴をリセット");
    reset.type = "button";
    let armed = false;
    reset.addEventListener("click", () => {
      if (!armed) { armed = true; reset.textContent = "もう一度押すとリセットします"; return; }
      clear(); reset.textContent = "リセットしました"; reset.disabled = true;
    });
    s.append(a, again, reset);
  }

  start();
})();
</script>
</body>
</html>
