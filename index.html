<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>testpages</title>
  <style>
    :root { --bg:#f6f6f4; --ink:#171717; --muted:#666; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; line-height:1.75; }
    main { max-width:640px; margin:0 auto; padding:48px 16px 80px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p.lead { color:var(--muted); font-size:14px; margin:0 0 28px; }
    nav.crumb { font-size:12px; color:var(--muted); margin-bottom:20px; }
    nav.crumb a { color:var(--muted); }
    ul.list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
    ul.list a { display:block; padding:14px 16px; background:var(--card); border:1.5px solid var(--ink); color:var(--ink); text-decoration:none; }
    ul.list a:hover { background:var(--ink); color:#fff; }
    ul.list small { display:block; font-size:12px; opacity:.7; }
  </style>
</head>
<body>
  <main>
    <h1>testpages</h1>
    <p class="lead">公開中のプロジェクト一覧</p>
    <ul class="list">
      <li><a href="projects/名古屋市学生社会課題解決プロジェクト/">名古屋市学生社会課題解決プロジェクト<small>プロトタイプ・制作物</small></a></li>
    </ul>
  </main>
</body>
</html>
